# Configuration for Phase I/II: baseline measurement, corrected baseline, regression reference.
# Every value marked "as found" is copied from the original project (file:line given).

data:
  raw_dir: ../data/raw/CMAPSSData          # relative to improved_implementation/
  subset: FD001                            # as found: src/nbgen.py:44-46
  fail_window: 30                          # as found: src/make_nb03.py:36  (label = RUL <= 30)
  std_threshold: 0.01                      # as found: src/make_nb03.py:67
  roll_window: 5                           # as found: src/make_nb03.py:89

seeds: [42, 43, 44, 45, 46]                # 42 = seed as found (src/make_nb04.py:32)
cv:
  n_splits: 5                              # as found: src/make_nb04.py:59
  truncations_per_unit: 10                 # truncated-validation: random cut points per validation engine
  min_cut_cycle: 31                        # shortest test trajectory in test_FD001.txt (features only, no labels)

# Tuned hyper-parameters exactly as selected by the original grid searches
# (notebooks 04/05 stored outputs; reproduced in baseline_repro/).
classifiers:
  logistic_regression: {C: 0.01, l1_ratio: 0, class_weight: null}
  decision_tree: {max_depth: 5, min_samples_leaf: 50, class_weight: null}
  random_forest: {n_estimators: 200, max_depth: null, max_features: sqrt, min_samples_leaf: 5}
  gradient_boosting: {learning_rate: 0.05, max_iter: 100, max_depth: 5, l2_regularization: 0.0}

# Original grids (src/make_nb04.py:214-218, 234-238; src/make_nb05.py:96-100, 130-135) for nested CV.
grids:
  logistic_regression:
    clf__C: [0.001, 0.01, 0.1, 1, 10]
    clf__l1_ratio: [0, 1]
    clf__class_weight: [null, balanced]
  decision_tree:
    clf__max_depth: [3, 5, 7, 9, 12]
    clf__min_samples_leaf: [1, 10, 50, 100]
    clf__class_weight: [null, balanced]
  random_forest:
    clf__max_depth: [8, 12, null]
    clf__min_samples_leaf: [1, 5, 20]
    clf__max_features: [sqrt, 0.5]
  gradient_boosting:
    clf__learning_rate: [0.05, 0.1]
    clf__max_iter: [100, 300]
    clf__max_depth: [3, 5]
    clf__l2_regularization: [0.0, 1.0]

# Regression transposition of the as-found pipeline (same 42 features, same model families,
# tree hyper-parameters transferred unchanged, target = uncapped linear RUL as built in
# src/make_nb03.py:39). NOT part of the original project - see AUDIT.md section 5.
regressors:
  ridge: {alpha: 1.0}
  decision_tree: {max_depth: 5, min_samples_leaf: 50}
  random_forest: {n_estimators: 200, max_depth: null, max_features: sqrt, min_samples_leaf: 5}
  gradient_boosting: {learning_rate: 0.05, max_iter: 100, max_depth: 5, l2_regularization: 0.0}
